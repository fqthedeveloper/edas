{% extends "base.html" %}
{% block title %}{% if form.instance.pk %}Edit{% else %}Add{% endif %} Template{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h3>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Template</h3>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <fieldset class="border p-3 mb-4">
                <legend class="w-auto">Template Details</legend>
                {{ form.as_p }}
            </fieldset>
            <div class="d-flex flex-wrap gap-2 mt-3">
                <button type="submit" class="btn btn-success">Save</button>
                <a href="{% url 'template_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

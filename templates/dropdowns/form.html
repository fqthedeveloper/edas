{% extends "base.html" %}
{% block title %}{% if form.instance.pk %}Edit{% else %}Add{% endif %} Dropdown{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h3>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Dropdown</h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex flex-wrap gap-2 mt-3">
                <button type="submit" class="btn btn-success">Save</button>
                <a href="{% url 'dropdown_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

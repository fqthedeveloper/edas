{% extends "base.html" %}
{% block title %}Edit Document{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">
        <h3>Edit Document: {{ document.document_number }}</h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex flex-wrap gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Update & Regenerate</button>
                <a href="{% url 'document_status' document.id %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
